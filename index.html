  :root {
    --ink: #e9fbff;
    --dim: rgba(198, 236, 248, 0.72);
    --line: rgba(150, 224, 255, 0.45);
    --glow: rgba(90, 200, 255, 0.55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    height: 100dvh;
    color: var(--ink);
    background:
      radial-gradient(80% 50% at 50% 28%, rgba(36, 110, 170, 0.28), transparent 60%),
      radial-gradient(40% 30% at 50% 78%, rgba(20, 40, 50, 0.5), transparent 70%),
      #07090c;
    font-family: ui-monospace, "Cascadia Code", "Segoe UI Mono", Menlo, Consolas, monospace;
  }
  .stage {
    height: 100dvh;
    max-height: 100dvh;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    padding: 10px 10px 12px;
    width: min(980px, 100%);
    margin: 0 auto;
    overflow: hidden;
  }
  .holo-wrap {
    flex: 1 1 auto;
    min-height: 0;
    width: min(96vw, 900px, calc(46dvh * 1.81));
    margin: 0;
    display: flex;
    flex-direction: column;
  }
  .holo {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    filter: none;
  }
  .quire {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    perspective: 1600px;
  }
  .holo-glass {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    color: #3a1458;
    font-family: Calligraffitti, Palatino, "Palatino Linotype", Georgia, serif;
    font-size: 22px;
    font-weight: 700;
    font-synthesis: weight;
    background: url("papyrus.png") center / 100% 100% no-repeat;
    border: none;
    box-shadow: none;
    container-type: size;
    padding: 11cqh 8cqw 10cqh 8cqw;
    overflow: hidden;
  }
  .holo-glass.blank header,
  .holo-glass.blank #view { visibility: hidden; }
  .turning {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    transform-style: preserve-3d;
    transform-origin: left center;
  }
  .turning .face {
    position: absolute;
    inset: 0;
    overflow: hidden;
    backface-visibility: hidden;
    background: url("papyrus.png") center / 100% 100% no-repeat;
    clip-path: none;
  }
  .turning .face.back { transform: rotateY(180deg); }
  .turning.go { animation: pageflip 0.72s ease-in-out forwards; }
  @keyframes pageflip {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(-180deg); }
  }
  header.chrome { display: none; }
  #view {
    position: relative;
    z-index: 1;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    padding: 0;
  }
  #view.center {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }
  h1.visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  h2, .prose p, .label { overflow-wrap: anywhere; }
  h2 {
    margin: 0 0 0.25em;
    font-size: 1.35em;
    font-weight: 700;
    line-height: 1.05;
    color: #2d0f48;
    text-shadow: none;
  }
  .prose p { margin: 0 0 0.35em; font-size: 1em; line-height: 1.15; color: #3a1458; }
  .kicker {
    margin: 0 0 0.1em;
    font-size: 0.85em;
    color: rgba(58, 20, 88, 0.65);
  }
  .stack { display: flex; flex-direction: column; gap: 0; }
  button, .holo-btn {
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  .holo-btn {
    display: flex;
    align-items: center;
    gap: 0.3em;
    width: 100%;
    text-align: left;
    min-height: 0;
    padding: 0.08em 0.15em;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(58, 20, 88, 0.22);
    color: #3a1458;
    box-shadow: none;
  }
  .holo-btn:hover, .holo-btn:focus-visible {
    background: rgba(58, 20, 88, 0.06);
    outline: none;
  }
  .holo-btn .label { flex: 1; min-width: 0; line-height: 1.05; font-size: 1.05em; overflow-wrap: anywhere; }
  .holo-btn.on { box-shadow: none; }
  .holo-btn.pick, .ghost.pick {
    background: rgba(58, 20, 88, 0.1);
    box-shadow: none;
  }
  .ghost.pick { color: #2d0f48; }
  .idx { flex: 0 0 auto; font-size: 0.85em; color: #5a2478; }
  .ico { width: 0.8em; height: 0.8em; flex: 0 0 auto; stroke: #3a1458; fill: none; stroke-width: 1.6; }
  .ghost {
    margin-top: 0.2em;
    background: transparent;
    border: none;
    color: rgba(58, 20, 88, 0.7);
    font-size: 0.95em;
    padding: 0.05em 0;
    min-height: 0;
  }
  .ghost:hover, .ghost:focus-visible { color: #2d0f48; outline: none; }
  label.ask {
    display: block;
    margin-bottom: 14px;
    font-size: 1.15em;
    margin-bottom: 0.3em;
    color: #3a1458;
  }
  form.gate { display: flex; flex-direction: column; gap: 12px; }
  input[name="pw"] {
    width: 100%;
    background: rgba(0, 16, 32, 0.35);
    border: none;
    border-bottom: 1px solid rgba(180, 240, 255, 0.75);
    color: #f4fdff;
    font: inherit;
    font-size: 18px;
    padding: 12px 4px;
    outline: none;
    caret-color: #bff6ff;
    border-radius: 0;
  }
  input[name="pw"]:focus { box-shadow: 0 8px 16px -12px rgba(140, 230, 255, 0.9); }
  .err {
    min-height: 1.2em;
    margin: 0;
    color: #ffb4b0;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-shadow: 0 0 8px rgba(255, 80, 70, 0.45);
  }
  .shake { animation: shake 0.35s linear; }
  @keyframes shake {
    20% { transform: translateX(-3px); }
    40% { transform: translateX(3px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
  }
  ul.ore, ul.roll { list-style: none; padding: 0; margin: 0 0 0.4em; }
  ul.ore li, ul.roll li {
    padding: 0.08em 0;
    border-bottom: 1px solid rgba(58, 20, 88, 0.2);
    letter-spacing: 0.02em;
    font-size: 0.95em;
  }
  .back { margin-bottom: 10px; }
  .rune { display: inline-block; width: 0.98em; height: 1.22em; vertical-align: -0.22em; overflow: visible; margin: 0 0.04em; }
  .holo-glass .rune { width: 0.85em; height: 1.05em; vertical-align: -0.16em; }
  .gap { display: inline-block; width: 0.42em; }
  .mark { color: #b7efff; opacity: 0.85; }
  .beam {
    height: 14px;
    width: min(280px, 58%);
    margin: 0 auto;
    background: linear-gradient(to bottom, rgba(130, 220, 255, 0.55), rgba(130, 220, 255, 0));
    filter: blur(5px);
    clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%);
    pointer-events: none;
    flex: 0 0 auto;
  }
  .tablet {
    position: relative;
    flex: 0 0 auto;
    align-self: center;
    width: min(96vw, 900px, calc(46dvh * 1.81));
    max-height: 46dvh;
    aspect-ratio: 470 / 260;
    margin-top: 0;
    padding: 8% 13% 7%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    container-type: size;
    background: url("stone.png") center / 100% 100% no-repeat;
    border: none;
    box-shadow: none;
  }
  .tablet .grain,
  .tablet .crystal,
  .tablet .crack,
  .tablet .moss { display: none; }
  .crystal {
    position: relative;
    z-index: 1;
    width: 18px;
    height: 24px;
    margin: -16px auto 2px;
    background: radial-gradient(circle at 40% 30%, #f7fdff, #5ad4ff 42%, #0a3a5c 74%);
    clip-path: polygon(50% 0, 100% 32%, 76% 100%, 24% 100%, 0 32%);
    box-shadow: 0 0 16px #49d4ff;
  }
  .wordmark {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    gap: 3px;
    margin-bottom: 2px;
    color: #2c261f;
  }
  .wordmark .rune.stone { width: 6cqw; height: 7.2cqw; max-width: none; }
  .alpha {
    position: relative;
    z-index: 1;
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(4, 1fr);
    align-items: center;
    justify-items: center;
  }
  .cell {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    min-height: 0;
    padding: 0;
  }
  .rune.stone {
    width: auto;
    height: 86%;
    max-width: 92%;
    margin: 0;
    display: block;
  }
  .cell .rune.holo {
    display: none;
    position: absolute;
    left: 50%;
    top: 50%;
    width: 86%;
    height: 86%;
    margin: 0;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 0 4px #e9fdff) drop-shadow(0 0 10px #3ecfff);
  }
  .cell.lit {
    background: rgba(110, 210, 255, 0.22);
    box-shadow: 0 0 14px rgba(80, 200, 255, 0.55);
  }
  .cell.lit .rune.holo { display: block; }
  .cell.lit .rune.stone { opacity: 0.15; }
  .pw-wrap {
    position: relative;
    min-height: 1.3em;
    border-bottom: 1px solid rgba(58, 20, 88, 0.45);
    padding: 8px 2px;
  }
  .pwline { min-height: 1.4em; line-height: 1.8; }
  .capture {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    border: 0;
    padding: 0;
    margin: 0;
    font-size: 16px;
    color: transparent;
    background: transparent;
    caret-color: transparent;
  }
  .caret {
    display: inline-block;
    width: 2px;
    height: 1.05em;
    margin-left: 2px;
    vertical-align: -0.12em;
    background: #3a1458;

const state = {
  lang: sessionStorage.getItem("ghuk-lang") || "goblin",
  open: sessionStorage.getItem("ghuk-open") === "1",
  screen: sessionStorage.getItem("ghuk-open") === "1" ? "menu" : "lock",

};

let buffer = "";

const view = document.getElementById("view");
const holo = document.getElementById("holo");
const statusEl = document.getElementById("status");
const pipEl = document.getElementById("pip");

function pass() {
  const raw = "Fjbeq Pbnfg Zrgnyyhetl";
  return raw.replace(/[a-zA-Z]/g, (c) => {
    const base = c <= "Z" ? 65 : 97;
    return String.fromCharCode(((c.charCodeAt(0) - base + 13) % 26) + base);
  });
}

function keyOf(ch) {
  const lower = ch.toLowerCase();
  if (lower === "æ") return "æ";
  if (RUNE[lower]) return lower;
  return null;
}

function glyph(ch, kind) {
  const key = keyOf(ch);
  if (!key) return null;
  const id = (kind === "stone" ? "s-" : "h-") + (key === "æ" ? "ae" : key);
  return '<svg class="rune ' + kind + '" viewBox="0 0 40 48" aria-hidden="true"><use href="#' + id + '"></use></svg>';
}

const DIGIT = {
  "0": "M12,12 H28 V36 H12 Z",
  "1": "M20,10 V38 M12,38 H28 M14,16 L20,10",
  "2": "M10,14 H30 L12,26 H30 L10,38 H30",
  "3": "M10,12 H30 V22 H16 M12,22 H30 V38 H10",
  "4": "M28,10 V38 M10,10 V22 H30",
  "5": "M30,12 H12 V24 H28 V36 H10",
  "6": "M28,14 H14 V36 H28 V24 H16",
  "7": "M10,12 H30 L14,38",
  "8": "M12,12 H28 V24 H12 Z M12,24 H28 V36 H12 Z",
  "9": "M12,12 H28 V24 H14 M28,12 V36 H12"
};

function digitSvg(ch) {
  const d = DIGIT[ch];
  if (!d) return "";
  return '<svg class="rune holo" viewBox="0 0 40 48" aria-hidden="true"><path d="' + d + '" fill="none" stroke="#3a1458" stroke-width="3.4" stroke-linecap="square"/></svg>';
}

function dotSvg() {
  return '<svg class="rune holo" viewBox="0 0 40 48" aria-hidden="true"><path d="M17 22 H23 V28 H17 Z" fill="#3a1458"/></svg>';
}

function esc(s) {
  const amp = String.fromCharCode(38);
  return String(s).replace(/[&<>"']/g, (c) => {
    if (c === amp) return amp + "amp;";
    if (c === "<") return amp + "lt;";
    if (c === ">") return amp + "gt;";
    if (c === '"') return amp + "quot;";
    return amp + "#39;";
  });
}

function inlineText(str, force) {
  const asRunes = force === "runes" || (force !== "english" && state.lang !== "common");
  if (!asRunes) return esc(str);
  let out = "";
  for (const ch of str) {
    if (ch === " ") { out += '<span class="gap"></span>'; continue; }
    const g = glyph(ch, "holo");
    if (g) { out += g; continue; }
    if (DIGIT[ch]) { out += digitSvg(ch); continue; }
    out += dotSvg();
  }
  return out;
}

function buildDefs() {
  const bits = [];
  for (const [key, d] of Object.entries(RUNE)) {
    const id = key === "æ" ? "ae" : key;
    const attrs = 'fill="none" stroke-linecap="square" stroke-linejoin="miter"';
    bits.push(
      '<symbol id="h-' + id + '" viewBox="0 0 40 48">' +
        '<path d="' + d + '" ' + attrs + ' stroke="#3a1458" stroke-width="3.6"/>' +
      "</symbol>"
    );
    bits.push(
      '<symbol id="s-' + id + '" viewBox="0 0 40 48">' +
        '<path d="' + d + '" ' + attrs + ' stroke="#1a140f" stroke-width="5.2"/>' +
        '<path d="' + d + '" ' + attrs + ' stroke="#b3a48c" stroke-width="1.7"/>' +
      "</symbol>"
    );
  }
  document.getElementById("defs").innerHTML = bits.join("");
}

function buildTablet() {
  const mark = document.getElementById("wordmark");
  mark.innerHTML = "GHUKLIAK".split("").map((ch) => glyph(ch, "stone")).join("");
  document.getElementById("alpha").innerHTML = LETTERS.map((letter) => {
    const k = letter.toLowerCase();
    return '<div class="cell" data-k="' + k + '">' + glyph(letter, "stone") + glyph(letter, "holo") + "</div>";
  }).join("");
}

function flash() {
  holo.classList.remove("spike");
  void holo.offsetWidth;
  holo.classList.add("spike");
}

let turning = false;

function turnThen(apply) {
  const page = document.getElementById("page");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!page || reduce || !view.innerHTML || turning) {
    apply();
    return;
  }
  turning = true;
  const ghost = document.createElement("div");
  ghost.className = "turning";
  ghost.setAttribute("aria-hidden", "true");
  ghost.innerHTML = '<div class="face front"></div><div class="face back"></div>';
  page.classList.add("blank");
  page.parentNode.appendChild(ghost);
  apply();
  void ghost.offsetWidth;
  ghost.classList.add("go");
  const done = () => {
    if (!ghost.isConnected) return;
    ghost.remove();
    page.classList.remove("blank");
    turning = false;
    fitPage();
  };
  ghost.addEventListener("animationend", done, { once: true });
  setTimeout(done, 800);
}

function setScreen(name) {
  state.screen = name;
  state.cursor = 0;
  turnThen(render);
}

function render() {
  document.body.classList.toggle("lock", state.screen === "lock");
  view.classList.toggle("center", state.screen === "lock");
  const parts = {
    lock: renderLock,
    menu: renderMenu,
    orders: renderOrders,
    metal: renderMetal,
    profiles: renderProfiles,
    profile: renderProfile,
    languages: renderLanguages
  };
  view.innerHTML = (parts[state.screen] || renderMenu)();
  view.scrollTop = 0;
  if (state.screen === "lock") {
    paintPw();
    const input = document.getElementById("pw");
    if (input) input.focus();
  } else if (state.screen === "languages") {
    state.cursor = state.lang === "common" ? 2 : 1;
  }
  paintCursor();
  fitPage();
}

function fitPage() {
  const page = document.getElementById("page");
  if (!page || !view) return;
  const ok = () =>
    view.scrollHeight <= view.clientHeight + 1 &&
    view.scrollWidth <= view.clientWidth + 1;
  let lo = 8;
  let hi = Math.min(34, Math.max(14, page.clientHeight / 11));
  let best = lo;
  for (let i = 0; i < 10; i++) {
    const mid = (lo + hi) / 2;
    page.style.fontSize = mid + "px";
    if (ok()) {
      best = mid;
      lo = mid;
    } else {
      hi = mid;
    }
  }
  page.style.fontSize = best + "px";
}

function navButtons() {
  return [...view.querySelectorAll("[data-go], [data-lang]")];
}

function paintCursor() {
  const buttons = navButtons();
  buttons.forEach((b) => b.classList.remove("pick"));
  if (!buttons.length || state.screen === "lock") return;
  if (state.cursor < 0) state.cursor = buttons.length - 1;
  if (state.cursor >= buttons.length) state.cursor = 0;
  const el = buttons[state.cursor];
  el.classList.add("pick");
  el.scrollIntoView({ block: "nearest" });
}

function goBack() {
  if (state.screen === "profile") { setScreen("profiles"); return; }
  if (state.screen === "menu" || state.screen === "lock") return;

function paintPw() {

function lightKey(ch) {
  document.querySelectorAll(".cell.lit").forEach((el) => el.classList.remove("lit"));

  if (!key) return;
  const cell = document.querySelector('.cell[data-k="' + key + '"]');
  if (!cell) return;
  cell.classList.add("lit");
  clearTimeout(lightKey.timer);
  lightKey.timer = setTimeout(() => cell.classList.remove("lit"), 450);
}

function tryPassword(value) {
  const got = String(value || "").trim().replace(/\s+/g, " ").toLowerCase();
  if (got === pass().toLowerCase()) {
    state.open = true;
    buffer = "";
    sessionStorage.setItem("ghuk-open", "1");
    setScreen("menu");
    return;
  }
  holo.classList.remove("deny");
  void holo.offsetWidth;
  holo.classList.add("deny");
  const line = document.getElementById("pwline");
  if (line) {
    line.classList.remove("shake");
    void line.offsetWidth;
    line.classList.add("shake");
  }
}

function takeKey(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (state.screen === "lock") {
    if (e.key === "Enter") {
      e.preventDefault();
      tryPassword(buffer);
      return;
    }
    if (e.key === "Backspace" || e.key === "Delete") {
      e.preventDefault();
      buffer = buffer.slice(0, -1);
      paintPw();
      return;
    }
    if (e.key === " ") {
      e.preventDefault();
      buffer += " ";
      paintPw();
      return;
    }
    if (/^[a-zA-Z]$/.test(e.key)) {
      e.preventDefault();
      buffer += e.key.toLowerCase();
      lightKey(e.key);
      paintPw();
    }
    return;
  }
  const buttons = navButtons();
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (buttons.length <= 1) {
      view.scrollBy({ top: e.key === "ArrowDown" ? 72 : -72 });
      return;
    }
    state.cursor += e.key === "ArrowDown" ? 1 : -1;
    paintCursor();
    return;
  }
  if (e.key === "Enter" || e.key === "ArrowRight") {
    e.preventDefault();
    const el = buttons[state.cursor];
    if (el) el.click();
    return;
  }
  if (e.key === "ArrowLeft" || e.key === "Escape" || e.key === "Backspace") {
    e.preventDefault();
    goBack();
  }
}

window.addEventListener("keydown", takeKey);

view.addEventListener("submit", (e) => {
  if (e.target.id !== "gate") return;
  e.preventDefault();
  tryPassword(buffer);
});

view.addEventListener("input", (e) => {
  if (e.target.id !== "pw") return;
  const extra = e.target.value;
  e.target.value = "";
  if (!extra) return;
  for (const ch of extra) {
    if (ch === " " || /^[a-zA-Z]$/.test(ch)) buffer += ch.toLowerCase();
  }
  const last = extra.replace(/[^a-zA-Z]/g, "").slice(-1);
  if (last) lightKey(last);
  paintPw();
});

view.addEventListener("click", (e) => {
  const langBtn = e.target.closest("[data-lang]");
  if (langBtn) {
    state.lang = langBtn.dataset.lang;
    sessionStorage.setItem("ghuk-lang", state.lang);
    turnThen(render);
    return;
  }
  const btn = e.target.closest("[data-go]");
  if (!btn) return;
  const go = btn.dataset.go;
  if (go === "seal") {
    state.open = false;
    state.who = null;
    buffer = "";
    sessionStorage.removeItem("ghuk-open");
    setScreen("lock");
    return;
  }
  if (go.startsWith("who:")) {
    state.who = go.slice(4);
    setScreen("profile");
    return;
  }
  setScreen(go);
});

buildDefs();
buildTablet();
render();
window.addEventListener("resize", fitPage);
</script>
</body>
</html>
